  <line x1="535" y1="255" x2="610" y2="255" stroke="#e55252" stroke-width="5" marker-end="url(#red-arrow)"/>
  <text x="526" y="200" text-anchor="end" font-size="11" fill="#667085">진행</text>
  <text x="596" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">측면 힘</text>
  <text x="535" y="330" text-anchor="middle" font-size="11" fill="#667085">정규화 × magnusStrength</text>

  <line x1="658" y1="249" x2="710" y2="249" stroke="#7b8797" stroke-width="3" marker-end="url(#gray-arrow)"/>

