  <circle cx="777" cy="325" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="794" cy="253" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="836" cy="187" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="786" y1="325" x2="827" y2="325" stroke="#e55252" stroke-width="3" marker-end="url(#red-arrow)"/>
  <line x1="803" y1="253" x2="844" y2="253" stroke="#e55252" stroke-width="3" marker-end="url(#red-arrow)"/>
  <line x1="845" y1="187" x2="886" y2="187" stroke="#e55252" stroke-width="3" marker-end="url(#red-arrow)"/>
  <text x="868" y="346" text-anchor="middle" font-size="11" fill="#667085">FixedUpdate마다</text>
