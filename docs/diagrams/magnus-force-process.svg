  <text x="257" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">linearVelocity</text>
  <text x="185" y="386" text-anchor="middle" font-size="11" fill="#667085">회전축과 진행 방향</text>

