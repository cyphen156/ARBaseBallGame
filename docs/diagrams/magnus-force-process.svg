  <circle cx="162" cy="260" r="48" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M139 222 Q162 240 139 278 M185 222 Q162 240 185 278" fill="none" stroke="#f07828" stroke-width="1.8"/>
  <line x1="162" y1="304" x2="162" y2="196" stroke="#f07828" stroke-width="3" marker-end="url(#orange-arrow)"/>
  <path d="M104 260 Q162 350 220 260" fill="none" stroke="#2f80ed" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <text x="162" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">angularVelocity</text>
