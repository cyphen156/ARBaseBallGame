  <text x="380" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">외적</text>
  <text x="380" y="231" text-anchor="middle" font-size="11" fill="#667085">회전 × 진행 속도</text>
  <text x="380" y="280" text-anchor="middle" font-size="11" fill="#667085">Cross(w, v)</text>

  <rect x="430" y="140" width="210" height="218" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/>
  <text x="535" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">마그누스 힘 방향</text>
