  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">회전과 진행 속도에서 마그누스 힘 적용</text>

  <text x="185" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">회전하는 공</text>
