<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1000" height="560" fill="#f4f7fb"/>
  <defs>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7b8797"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2f80ed"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#f07828"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#42bd68"/></marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">공의 진행 방향에 따른 회전 방향 결정</text>

  <text x="155" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">공의 진행 방향</text>
  <rect x="45" y="88" width="220" height="350" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/>
  <line x1="155" y1="386" x2="155" y2="138" stroke="#7b8797" stroke-width="2.5" marker-end="url(#gray-arrow)"/>
  <text x="170" y="144" font-size="11" fill="#667085">공의 정면 방향</text>
  <line x1="155" y1="386" x2="94" y2="196" stroke="#2f80ed" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <line x1="155" y1="386" x2="216" y2="196" stroke="#2f80ed" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <text x="76" y="183" font-size="12" font-weight="bold" fill="#1a1a1a">왼쪽</text>
  <text x="218" y="183" font-size="12" font-weight="bold" fill="#1a1a1a">오른쪽</text>
  <circle cx="155" cy="386" r="9" fill="#1a1a1a"/>

  <line x1="280" y1="260" x2="385" y2="260" stroke="#7b8797" stroke-width="3" marker-end="url(#gray-arrow)"/>
  <text x="332" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">외적 · 내적</text>
  <text x="332" y="233" text-anchor="middle" font-size="11" fill="#667085">공의 정면 방향 × 진행 방향</text>
  <text x="332" y="282" text-anchor="middle" font-size="11" fill="#667085">외적 결과 · 위쪽 축</text>
  <text x="332" y="305" text-anchor="middle" font-size="11" fill="#667085">Mathf.Sign</text>

  <circle cx="480" cy="260" r="82" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
  <path d="M398 260 A82 82 0 0 1 562 260" fill="#f07828" fill-opacity="0.16"/>
  <path d="M398 260 A82 82 0 0 0 562 260" fill="#42bd68" fill-opacity="0.16"/>
  <line x1="398" y1="260" x2="562" y2="260" stroke="#7b8797" stroke-width="1.5"/>
  <text x="480" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#f07828">+1 · 오른쪽 진행</text>
  <text x="480" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#269e49">−1 · 왼쪽 진행</text>
  <text x="480" y="155" text-anchor="middle" font-size="11" fill="#667085">외적 결과의 위쪽 축 성분</text>

  <line x1="555" y1="225" x2="714" y2="145" stroke="#f07828" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <line x1="555" y1="295" x2="714" y2="375" stroke="#42bd68" stroke-width="4" marker-end="url(#green-arrow)"/>
  <text x="622" y="126" font-size="12" font-weight="bold" fill="#f07828">directionSign +1</text>
  <text x="622" y="410" font-size="12" font-weight="bold" fill="#269e49">directionSign −1</text>

  <text x="810" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">같은 transform.up 축</text>
  <circle cx="810" cy="145" r="42" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M790 112 Q810 128 790 162 M830 112 Q810 128 830 162" fill="none" stroke="#f07828" stroke-width="1.5"/>
  <line x1="810" y1="183" x2="810" y2="91" stroke="#f07828" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
  <path d="M758 145 Q810 226 862 145" fill="none" stroke="#2f80ed" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <text x="810" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">좌측 커브를 만드는 회전</text>

  <circle cx="810" cy="375" r="42" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M790 342 Q810 358 790 392 M830 342 Q810 358 830 392" fill="none" stroke="#f07828" stroke-width="1.5"/>
  <line x1="810" y1="413" x2="810" y2="321" stroke="#f07828" stroke-width="2.5" marker-end="url(#orange-arrow)"/>
  <path d="M862 375 Q810 456 758 375" fill="none" stroke="#2f80ed" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <text x="810" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">우측 커브를 만드는 회전</text>

  <path d="M735 495 V520 H885 V495" fill="none" stroke="#7b8797" stroke-width="2"/>
  <text x="810" y="546" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">동일한 회전축 · 반대 방향</text>
</svg>
